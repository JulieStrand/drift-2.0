    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // --- MOBILE MENU TOGGLE ---
        const mobileBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");

        mobileBtn.addEventListener("click", () => {
          const isOpen = mobileMenu.classList.toggle("hidden");
          mobileBtn.setAttribute("aria-expanded", String(!isOpen));
        });

        // --- TOUCH-HOVER EFFECT FOR MOBILE ONLY ---
        // This checks if the device is touch-capable.
        const isTouchDevice =
          "ontouchstart" in window || navigator.maxTouchPoints > 0;

        // Only run the rest of the code on touch devices.
        if (isTouchDevice) {
          const projectLinks = document.querySelectorAll(".grid a.group");

          // Function to remove the 'touched' class from all project links.
          const resetAllLinks = () => {
            projectLinks.forEach((link) => {
              link.classList.remove("touched");
            });
          };

          projectLinks.forEach((link) => {
            link.addEventListener("click", function (event) {
              // Check if this specific link was already tapped.
              const wasAlreadyTouched = this.classList.contains("touched");

              // If it was already tapped, let the link work normally (navigate).
              if (wasAlreadyTouched) {
                return; // Exit the function, allowing the link to navigate.
              }

              // --- This is the FIRST TAP ---
              // 1. Prevent the link from navigating.
              event.preventDefault();

              // 2. Reset any other links that might have been tapped.
              resetAllLinks();

              // 3. Add the 'touched' class to THIS link to show the overlay.
              this.classList.add("touched");
            });
          });

          // Add a listener to the page to reset links if you tap anywhere else.
          document.addEventListener("click", function (event) {
            // If the click was NOT on a project link, reset everything.
            if (!event.target.closest(".grid a.group")) {
              resetAllLinks();
            }
          });
        }
      });
    </script>
