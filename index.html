    <script>
      const images = document.querySelectorAll(".slideshow picture");
      const links = document.querySelectorAll(".project-link");
      const credits = document.querySelectorAll(".credit");
      // NEW: cache the container
      const slideshowEl = document.querySelector(".slideshow");

      // Only run on desktop layout (xl:block)
      const isDesktopXL = window.matchMedia("(min-width: 1280px)").matches;

      if (isDesktopXL && slideshowEl) {
        slideshowEl.style.minHeight = "100dvh"; // fallback to 100vh if you prefer
      }

      // Pan classes used by desktop fade show
      const desktopPans = [
        "pan-dr",
        "pan-dl",
        "pan-ur",
        "pan-ul",
        "pan-lr",
        "pan-rl",
      ];

      // Timing constants
      const DURATION_MS = 10000;
      const OVERLAP_DELAY_MS = DURATION_MS * 0.7;

      let currentIndex = 0;
      let nextTimerId = null;

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (nextTimerId) clearTimeout(nextTimerId); // pause the show
        } else {
          if (nextTimerId) clearTimeout(nextTimerId); // clear old titles
          normalizeSlideState(); // fix any stray .show/.hide
          nextTimerId = setTimeout(showNextSlide, 500); // resume shortly
        }
      });

      function showNextSlide() {
        if (!isDesktopXL || images.length === 0) return;

        // --- Get the current slide and its related elements ---
        const i = currentIndex;
        const currentImage = images[i];
        const currentLink = links[i];
        const currentCredit = credits[i];

        const panCls =
          desktopPans[Math.floor(Math.random() * desktopPans.length)];

        // new cleanup logic added 7/26/2026
        // --- NEW CODE TO ADD: Forcefully clean up the slide that is 2 steps behind ---
        const twoStepsBack = (i - 2 + images.length) % images.length;
        if (images[twoStepsBack]) {
          images[twoStepsBack].classList.remove("show", ...desktopPans);
          links[twoStepsBack]?.classList.remove("show");
          links[twoStepsBack]?.classList.add("hide");
          credits[twoStepsBack]?.classList.remove("show");
          credits[twoStepsBack]?.classList.add("hide");
        }
        // --- END OF NEW CODE ---

        // --- Define what happens when the animation ends ---
        // Using { once: true } so the listener automatically removes itself after firing

        // --- Define what happens when the animation ends ---
        // Using { once: true } so the listener automatically removes itself after firing
        currentImage.addEventListener(
          "animationend",
          (event) => {
            // Hide it only if the 'fade-in-out' animation finished
            // Prevent other animations from accidentally triggering the cleanup
            if (event.animationName === "fade-in-out") {
              currentImage.classList.remove("show", ...desktopPans);
              currentLink?.classList.remove("show");
              currentCredit?.classList.remove("show");
              currentLink?.classList.add("hide");
              currentCredit?.classList.add("hide");
            }
          },
          { once: true },
        );

        // Make it visible: drop `hide` before adding `show`

        currentLink?.classList.remove("hide");
        currentCredit?.classList.remove("hide");

        // --- Start the animation ---

        currentImage.classList.add("show", panCls);
        currentLink?.classList.add("show");
        currentCredit?.classList.add("show");

        // --- Prepare for the next slide ---
        currentIndex = (i + 1) % images.length;
        nextTimerId = setTimeout(showNextSlide, OVERLAP_DELAY_MS);
        // setTimeout(showNextSlide, OVERLAP_DELAY_MS);
      }

      // Start the slideshow
      if (isDesktopXL) nextTimerId = setTimeout(showNextSlide, 10);
      // if (isDesktopXL) setTimeout(showNextSlide, 10);

      function cleanupActiveSlide() {
        const n = images.length;
        if (n === 0) return;

        // The visible slide is the one we showed last:
        const prev = (currentIndex - 1 + n) % n;
        const img = images[prev];
        const link = links[prev];
        const credit = credits[prev];

        // Immediately undo what animationend would have done
        img?.classList.remove("show", ...desktopPans);
        link?.classList.remove("show");
        credit?.classList.remove("show");
        link?.classList.add("hide");
        credit?.classList.add("hide");
      }

      // --- Click-to-advance (image only) ---
      function advanceNow() {
        if (!isDesktopXL) return;
        if (nextTimerId) clearTimeout(nextTimerId);
        cleanupActiveSlide();
        showNextSlide();
      }

      // Attach to the container so overlays don't block it
      if (slideshowEl) {
        slideshowEl.addEventListener(
          "click",
          (e) => {
            // let actual link clicks navigate normally
            if (e.target.closest(".project-link")) return;
            e.preventDefault();
            advanceNow();
          },
          { passive: true },
        );
      }

      // Helper to normalize slide state
      function normalizeSlideState() {
        const n = images.length;
        if (n === 0) return;

        // Hide everything first
        images.forEach((img) => img.classList.remove("show", ...desktopPans));
        links.forEach((l) => {
          l?.classList.remove("show");
          l?.classList.add("hide");
        });
        credits.forEach((c) => {
          c?.classList.remove("show");
          c?.classList.add("hide");
        });

        // Keep the last *shown* slide visible so you don't get a black screen
        const visible = (currentIndex - 1 + n) % n;
        images[visible]?.classList.add("show"); // no pan here; we just hold the frame
        links[visible]?.classList.remove("hide");
        links[visible]?.classList.add("show");
        credits[visible]?.classList.remove("hide");
        credits[visible]?.classList.add("show");
      }

      // MOBILE MENU TOGGLE
      const mobileBtn = document.getElementById("mobile-menu-btn");
      const mobileMenu = document.getElementById("mobile-menu");

      if (mobileBtn && mobileMenu) {
        mobileBtn.setAttribute("aria-expanded", "false");
        mobileBtn.addEventListener("click", () => {
          const isOpen = !mobileMenu.classList.toggle("hidden");
          mobileBtn.setAttribute("aria-expanded", String(isOpen));
        });
      }
